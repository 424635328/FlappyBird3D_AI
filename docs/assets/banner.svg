<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="FlappyBird3D_AI — 3D Flappy Bird trained with PPO and Unity ML-Agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#101d30"/>
      <stop offset="1" stop-color="#0a1626"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
    <linearGradient id="bird" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#f4a261"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f6feb"/>
      <stop offset="1" stop-color="#2f81f7"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>

  <!-- 右侧管道走廊 -->
  <g opacity="0.95">
    <rect x="1006" y="-60" width="70" height="150" rx="12" fill="url(#pipe)" opacity="0.55"/>
    <rect x="996" y="82" width="90" height="20" rx="7" fill="#58a6ff" opacity="0.85"/>
    <rect x="1006" y="222" width="70" height="150" rx="12" fill="url(#pipe)" opacity="0.55"/>
    <rect x="996" y="198" width="90" height="20" rx="7" fill="#58a6ff" opacity="0.85"/>
  </g>

  <!-- 小鸟 -->
  <g transform="translate(152 150)">
    <path d="M-40 0 L0 -32 L40 0 L0 32 Z" fill="url(#bird)"/>
    <circle cx="12" cy="-9" r="5.5" fill="#0b1220"/>
    <path d="M40 -2 L66 6 L40 15 Z" fill="#f77f00"/>
    <path d="M-20 4 L-46 20 L-14 18 Z" fill="#e76f51" opacity="0.92"/>
  </g>

  <text x="616" y="130" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="60" font-weight="700" fill="#f0f6fc" letter-spacing="0.5">FlappyBird3D_AI</text>

  <text x="616" y="174" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="19" fill="#9aa7b6" letter-spacing="3.2">3D FLAPPY BIRD · PPO · UNITY ML-AGENTS</text>

  <rect x="466" y="198" width="300" height="4" rx="2" fill="url(#accent)"/>

  <text x="616" y="240" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="15" fill="#6e7b8b" letter-spacing="1.2">Unity 2023.2.20f1c1 · mlagents 1.1.0 · 12-D Observation · 3 Discrete Actions</text>
</svg>
